name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    name: test
    env:
      # RENO_NUM_THREADS does not reach the OpenBLAS bundled with NumPy/SciPy
      # wheels. Four xdist workers each starting one BLAS thread per core
      # oversubscribe the runner: the suite stalled for 50+ minutes instead of
      # finishing in a few. Job-level so every step (tests, examples) gets it.
      RENO_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
    steps:
      - name: install openblas
        run: |
            sudo apt-get update
            sudo apt-get -y install libblas-dev liblapack-dev
      - uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          # pyproject.toml requires Python >=3.10
          python-version: "3.11"
          cache: "pip"
      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -e ".[dev]"
      - name: run tests
        run: |
          pip install pytest-xdist pytest-cov
          pytest -n 4 --durations=0 --cov=renormalizer renormalizer tools/backend_validation/tests
      - name: run optional tests
        run: |
          pip install primme==3.2.* pyscf==2.4.0
          pytest --durations=0 renormalizer/mps/tests/test_gs.py::test_multistate --cov=renormalizer --cov-append
          pytest --durations=0 renormalizer/mps/tests/test_gs.py::test_pyscf_solver --cov=renormalizer --cov-append
      - name: run examples
        run: |
            cd example; bash run.sh
            cd ..
      - name: install pandoc
        run:
            sudo apt-get install pandoc
      - name: test build doc
        run: |
          cd doc
          make html
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  backend:
    # Optional array backends on CPU. Without this job every jax/torch test is
    # skipped, so their adapters would have no automated coverage.
    runs-on: ubuntu-latest
    name: backend (${{ matrix.backend }})
    strategy:
      fail-fast: false
      matrix:
        backend: [torch, jax]
    env:
      RENO_TEST_BACKEND: ${{ matrix.backend }}
      RENO_TEST_DEVICE: cpu
      RENO_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"
      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          # The CPU wheel index keeps the torch job from downloading CUDA wheels.
          extra=""
          if [ "${{ matrix.backend }}" = torch ]; then
            extra="--extra-index-url https://download.pytorch.org/whl/cpu"
          fi
          pip install --no-cache-dir -e ".[dev,${{ matrix.backend }}]" $extra
      - name: run backend tests
        run: |
          pytest --durations=20 \
            renormalizer/backend/tests \
            renormalizer/mps/tests/test_multibackend_spin.py \
            renormalizer/tn/tests/test_multibackend_spin.py \
            renormalizer/property/tests/test_transition_and_mobility.py
